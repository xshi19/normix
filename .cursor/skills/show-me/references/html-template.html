<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- short title --></title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {delimiters: [{left:'$$',right:'$$',display:true},{left:'\\(',right:'\\)',display:false}]});"></script>
<!-- UMD, not ESM: file:// pages cannot import mermaid.esm.min.mjs from a CDN. -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({
    startOnLoad: true,
    theme: 'base',
    themeVariables: {
      primaryColor: '#faf9f5', primaryTextColor: '#141413',
      primaryBorderColor: '#1b365d', lineColor: '#6b6a64',
      fontFamily: 'Charter, Georgia, serif', fontSize: '14px'
    }
  });
</script>
<style>
  :root {
    --paper: #f5f4ed; --surface: #faf9f5; --sand: #e8e6dc; --ink: #141413;
    --muted: #6b6a64; --accent: #1b365d; --accent-light: #2d5a8a;
    --rule: #d8d4c8; --code-surface: #f0eee6;
    --good: #28724f; --warn: #9b6a1f; --bad: #9b3a34;
    --serif: Charter, Georgia, "Palatino Linotype", Palatino, serif;
    --mono: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--serif); font-size: 17px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 52rem; margin: 0 auto; padding: 2.2rem 1.4rem 3rem; }
  header.doc { border-bottom: 1px solid var(--rule); padding-bottom: 1rem; margin-bottom: 1.6rem; }
  .kicker { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--accent); margin: 0 0 0.4rem; }
  h1 { font-size: 1.9rem; font-weight: 500; margin: 0 0 0.35rem; line-height: 1.2; }
  .sub { color: var(--muted); margin: 0; font-size: 0.98rem; }
  h2 { font-size: 1.35rem; font-weight: 500; margin: 2rem 0 0.7rem;
       border-top: 1px solid var(--rule); padding-top: 1.1rem; }
  p { max-width: 74ch; }
  code { font-family: var(--mono); font-size: 0.86em; background: var(--code-surface);
         border: 1px solid var(--rule); border-radius: 4px; padding: 0.08em 0.28em; }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0 1.4rem;
          font-size: 0.92em; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 0.45rem 0.6rem; vertical-align: top;
           border-bottom: 1px solid var(--rule); }
  thead tr { background: var(--surface); border-bottom: 1.5px solid var(--rule); }
  th { font-weight: 500; }
  .ok { color: var(--good); font-weight: 500; }
  .part { color: var(--warn); font-weight: 500; }
  .no { color: var(--bad); font-weight: 500; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
           gap: 0.7rem; margin: 1.1rem 0 0.4rem; }
  .card { background: var(--surface); border: 1px solid var(--rule);
          border-left: 3px solid var(--accent); border-radius: 6px; padding: 0.7rem 0.9rem; }
  .card h3 { margin: 0 0 0.25rem; font-size: 0.98rem; font-weight: 500; }
  .card p { margin: 0; font-size: 0.88rem; color: var(--muted); }
  .math-block { background: var(--surface); border: 1px solid var(--rule);
                border-left: 3px solid var(--accent); border-radius: 6px;
                padding: 0.6rem 1rem; margin: 1rem 0; overflow-x: auto; }
  .mermaid { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px;
             padding: 0.8rem; margin: 1rem 0; display: flex; justify-content: center; }
  .footnote { color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--rule);
              margin-top: 2rem; padding-top: 0.8rem; }
  @media (max-width: 640px) {
    body { font-size: 16px; }
    main { padding: 1.4rem 1rem 2rem; }
    h1 { font-size: 1.45rem; }
    .wide-table { overflow-x: auto; }
    .wide-table table { min-width: 560px; }
  }
</style>
</head>
<body>
<main>
  <header class="doc">
    <p class="kicker"><!-- show-me · topic --></p>
    <h1><!-- one-line claim --></h1>
    <p class="sub"><!-- who this is for, in one sentence --></p>
  </header>

  <h2><!-- section --></h2>
  <p><!-- short prose next to the visual --></p>
  <div class="math-block">
    $$ <!-- display math --> $$
  </div>
  <div class="mermaid">
flowchart LR
    A[input] --> B[result]
  </div>

  <p class="footnote">Conversation artifact — promote to docs/ or dev-notes/ if it should last.</p>
</main>
</body>
</html>
