[[allow]]
id = "independent-gamma-specification"
paths = ["normix/distributions/gamma.py", "formal/lean/Normix/Distributions/GammaParameters.lean"]
symbols = ["normix.distributions.gamma.Gamma.var", "Normix.Distributions.gammaVar"]
