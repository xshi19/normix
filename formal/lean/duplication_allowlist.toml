# Intentional duplication examples for scan/report tools; no automatic deduplication.
# Paths are repository-relative; symbols limit each exception within those files.
# Skip only the listed fragments, not every similarity in a listed file.
# source identifies the in-repo rationale; review entries when their scope changes.

[[allow]]
id = "distribution-natural-parameters"
paths = ["normix/distributions/gamma.py", "normix/distributions/inverse_gamma.py", "normix/distributions/inverse_gaussian.py"]
symbols = [
  "normix.distributions.gamma.Gamma.natural_params",
  "normix.distributions.inverse_gamma.InverseGamma.natural_params",
  "normix.distributions.inverse_gaussian.InverseGaussian.natural_params",
]
reason = "Keep each distribution's explicit theta formula beside its own sufficient statistics and parameter conventions."
source = "AGENTS.md#design-philosophy"

[[allow]]
id = "distribution-expectation-formulas"
paths = ["normix/distributions/gamma.py", "normix/distributions/inverse_gamma.py", "normix/distributions/inverse_gaussian.py"]
symbols = [
  "normix.distributions.gamma.Gamma._grad_log_partition",
  "normix.distributions.inverse_gamma.InverseGamma._grad_log_partition",
  "normix.distributions.inverse_gaussian.InverseGaussian._grad_log_partition",
]
reason = "Keep explicit eta formulas and their domains for each distribution; similar structure does not justify a shared formula."
